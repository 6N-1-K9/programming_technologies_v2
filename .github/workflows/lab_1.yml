name: Lab 1 Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r lab_1/requirements.txt

      - name: Run tests
        run: python -m pytest lab_1/test -v

      - name: Check code style
        run: pycodestyle lab_1/src lab_1/test
